# Serving a single-page app: every path that is not a file on disk is the app's
# own router talking, and must be answered with index.html rather than 404.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The bundle is minified and mostly text. Fonts and images are already
    # compressed and gzipping them again only costs CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # nginx guesses the wrong charset for the Arabic strings compiled into the
    # bundle, and a mis-declared charset renders the whole interface as mojibake.
    charset           utf-8;
    charset_types     text/css text/plain application/javascript application/json;

    # Not a substitute for the headers the API sets, but this origin serves the
    # document, so clickjacking and MIME sniffing are its problem.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    # ---------------------------------------------------------------------
    # /exam/:token — the candidate's entry point, and a credential in a URL
    #
    # It needs the SPA fallback like any other deep link: a candidate opens this
    # from an email, so it is always a cold navigation and never a client-side
    # route change, and without the fallback every invitation 404s.
    #
    # It also needs three things an ordinary route does not.
    #
    # The token in the path is the only thing standing between a stranger and
    # somebody's exam, so the response must not be stored — not by the browser,
    # not by a shared proxy on a school or corporate network where a cached copy
    # would be served to the next candidate — and the address must not be handed
    # to any third party the page loads (the app pulls webfonts from Google).
    # Referrer-Policy: no-referrer stops the token leaving in a Referer header.
    #
    # ^~ so this wins over any regex location below it; the token is base64url,
    # so it can contain characters like - and _ but never a slash or a dot, and
    # nothing here needs to parse it.
    # ---------------------------------------------------------------------
    location ^~ /exam/ {
        add_header Cache-Control  "no-store, no-cache, must-revalidate" always;
        add_header Pragma         "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri /index.html;
    }

    # Rewritten at container start from environment variables. Caching it would
    # mean a browser that visited before a redeploy keeps calling the old API.
    location = /assets/config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed filenames: the name changes whenever the content does, so these are
    # safe to keep for a year and cheap to serve from cache.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is not hashed. Cached, it would keep pointing at bundles that a
    # redeploy has already deleted, and the app would fail to load with no visible
    # reason until someone thought to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Every other path belongs to the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
